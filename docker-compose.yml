# Local HTTP quickstart: docker compose up -d --build --wait
services:
  git-cdn:
    image: git-cdn:local
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    ports:
      - "127.0.0.1:${GIT_CDN_HTTP_PORT:-8080}:8080"
    volumes:
      - git-cdn-data:/var/lib/git-cdn
      - type: bind
        source: ${GIT_CDN_CONFIG:-./docker/config.yaml}
        target: /etc/git-cdn/config.yaml
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  git-cdn-data:
