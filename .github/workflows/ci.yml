name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  container:
    name: Docker Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.ssh.yml config --quiet
      - name: Build image
        run: docker compose -p git-cdn-ci build
      - name: Start and inspect runtime
        run: |
          docker compose -p git-cdn-ci up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8080/healthz
          docker compose -p git-cdn-ci exec -T git-cdn git --version
          docker compose -p git-cdn-ci exec -T git-cdn ssh-keygen -lf /var/lib/git-cdn/ssh_host_ed25519_key.pub
      - name: Show logs and remove test stack
        if: always()
        run: |
          docker compose -p git-cdn-ci logs
          docker compose -p git-cdn-ci down -v

  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: module
          - os: macos-15
            go: module
          - os: ubuntu-24.04
            go: stable

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check tool versions
        run: |
          go version
          git --version

      - name: Ensure Git supports reftable
        run: |
          probe="${RUNNER_TEMP}/git-cdn-ref-format-probe"
          if ! git init --quiet --bare --ref-format=reftable "$probe"; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo add-apt-repository --yes ppa:git-core/ppa
              sudo apt-get update
              sudo apt-get install --yes git
            else
              brew install git
              task_git_bin="$(brew --prefix git)/bin"
              printf '%s\n' "$task_git_bin" >> "$GITHUB_PATH"
              export PATH="$task_git_bin:$PATH"
            fi
            git init --quiet --bare --ref-format=reftable "$probe"
          fi
          git --version
          rm -rf "$probe"

      - name: Ensure Git LFS client is available
        run: |
          if ! command -v git-lfs >/dev/null; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install --yes git-lfs
            else
              brew install git-lfs
              task_lfs_bin="$(brew --prefix git-lfs)/bin"
              printf '%s\n' "$task_lfs_bin" >> "$GITHUB_PATH"
              export PATH="$task_lfs_bin:$PATH"
            fi
          fi
          git lfs version

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check formatting and module files
        if: matrix.go == 'module' && matrix.os == 'ubuntu-24.04'
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Lint Grafana dashboard
        if: matrix.go == 'module' && matrix.os == 'ubuntu-24.04'
        uses: grafana/dashboard-linter@c7d457aca03b773a9353be7e9d53d920b10f646c # v0.5.2
        with:
          files: dashboards
          args: --config dashboards/.lint --strict

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        run: |
          set +e
          go test -race -count=1 -timeout=5m ./... > "${RUNNER_TEMP}/gotest.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/gotest.log"
          if [ "$status" -ne 0 ]; then
            grep -B2 -A10 -E '^--- FAIL:|^panic|^WARNING: DATA RACE' "${RUNNER_TEMP}/gotest.log" | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
          fi
          exit "$status"

      - name: Flake amplification for the server package (non-blocking)
        if: matrix.os == 'macos-15' && matrix.go == 'module'
        continue-on-error: true
        run: |
          set +e
          go test -race -count=2 -shuffle=on -timeout=10m ./internal/server > "${RUNNER_TEMP}/amplify.log" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/amplify.log"
          if [ "$status" -ne 0 ]; then
            grep -B2 -A10 -E '^--- FAIL:|^panic|^WARNING: DATA RACE' "${RUNNER_TEMP}/amplify.log" | while IFS= read -r line; do
              echo "::error::${line}"
            done || true
          fi
          exit "$status"

      - name: Probe native Git protocol behavior
        run: go run ./scripts/protocol-probe

      - name: Fuzz protocol parsing
        if: matrix.go == 'module' && matrix.os == 'ubuntu-24.04'
        run: go test ./internal/protocol -run='^$' -fuzz=FuzzParseFetch -fuzztime=10s -parallel=2
