name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: module
          - os: macos-15
            go: module
          - os: ubuntu-24.04
            go: stable

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check tool versions
        run: |
          go version
          git --version

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check formatting and module files
        if: matrix.go == 'module' && matrix.os == 'ubuntu-24.04'
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detection
        run: go test -race -count=1 -timeout=5m ./...

      - name: Probe native Git protocol behavior
        run: go run ./scripts/protocol-probe

      - name: Fuzz protocol parsing
        if: matrix.go == 'module' && matrix.os == 'ubuntu-24.04'
        run: go test ./internal/protocol -run='^$' -fuzz=FuzzParseFetch -fuzztime=10s -parallel=2
