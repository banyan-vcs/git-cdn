<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="system-ui, 'Segoe UI', 'Noto Sans', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44403c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1917"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>

  <!-- clients -->
  <g text-anchor="middle">
    <text x="109" y="52" font-size="11" fill="#57534e" font-family="ui-monospace, Consolas, monospace" letter-spacing="2">CLIENTS</text>
    <rect x="24" y="64" width="170" height="40" rx="9" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="109" y="82" font-size="12.5" font-weight="600" fill="#1c1917">git CLI</text>
    <text x="109" y="97" font-size="10.5" fill="#57534e">smart HTTP v2</text>
    <rect x="24" y="116" width="170" height="40" rx="9" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="109" y="134" font-size="12.5" font-weight="600" fill="#1c1917">CI / build agents</text>
    <text x="109" y="149" font-size="10.5" fill="#57534e">plain git over HTTPS</text>
    <rect x="24" y="168" width="170" height="40" rx="9" fill="#ffffff" stroke="#e7e5e4"/>
    <text x="109" y="186" font-size="12.5" font-weight="600" fill="#1c1917">SSH clients</text>
    <text x="109" y="201" font-size="10.5" fill="#57534e">passwords / tokens</text>
  </g>

  <!-- requests / responses -->
  <g font-size="10" fill="#57534e" font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <line x1="198" y1="106" x2="232" y2="106" stroke="#44403c" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="215" y="98">requests</text>
    <line x1="232" y1="140" x2="198" y2="140" stroke="#1c1917" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="215" y="158" fill="#1c1917">packs</text>
  </g>

  <!-- git-cdn container -->
  <rect x="240" y="40" width="450" height="360" rx="14" fill="#f5f5f4" stroke="#44403c" stroke-width="1.5"/>
  <text x="465" y="66" text-anchor="middle" font-size="15" font-weight="700" fill="#292524">git-cdn</text>

  <!-- frontends -->
  <g text-anchor="middle">
    <rect x="258" y="78" width="200" height="42" rx="9" fill="#ffffff" stroke="#44403c"/>
    <text x="358" y="96" font-size="12" font-weight="600" fill="#1c1917">HTTP v2 frontend</text>
    <text x="358" y="111" font-size="10" fill="#57534e">routing · limits · credentials</text>
    <rect x="472" y="78" width="200" height="42" rx="9" fill="#ffffff" stroke="#44403c"/>
    <text x="572" y="96" font-size="12" font-weight="600" fill="#1c1917">SSH password proxy</text>
    <text x="572" y="111" font-size="10" fill="#57534e">terminates SSH · strict host keys</text>
  </g>

  <g stroke="#44403c" stroke-width="1.8">
    <line x1="358" y1="120" x2="358" y2="130" marker-end="url(#a)"/>
    <line x1="572" y1="120" x2="572" y2="130" marker-end="url(#a)"/>
  </g>

  <!-- eligibility policy -->
  <rect x="258" y="134" width="414" height="32" rx="8" fill="#44403c"/>
  <text x="465" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#fafaf9">routing · fetch eligibility policy</text>

  <g stroke="#44403c" stroke-width="1.8">
    <line x1="358" y1="166" x2="358" y2="178" marker-end="url(#a)"/>
    <line x1="572" y1="166" x2="572" y2="178" marker-end="url(#a)"/>
  </g>

  <!-- lane A: local fetch path -->
  <rect x="258" y="182" width="200" height="118" rx="9" fill="#ffffff" stroke="#44403c"/>
  <text x="272" y="202" font-size="12" font-weight="600" fill="#44403c">local fetch path</text>
  <g font-size="10.5" fill="#57534e" font-family="ui-monospace, Consolas, monospace">
    <text x="272" y="222">authorize — live ls-refs</text>
    <text x="272" y="240">verify — graph complete</text>
    <text x="272" y="258">hydrate — exact OIDs</text>
    <text x="272" y="276">upload-pack · spool</text>
  </g>
  <text x="272" y="293" font-size="9.5" fill="#a8a29e" font-family="ui-monospace, Consolas, monospace">per-request credentials</text>

  <!-- lane B: passthrough -->
  <rect x="472" y="182" width="200" height="118" rx="9" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="486" y="202" font-size="12" font-weight="600" fill="#57534e">passthrough</text>
  <g font-size="10.5" fill="#57534e" font-family="ui-monospace, Consolas, monospace">
    <text x="486" y="222">discovery · ls-refs</text>
    <text x="486" y="240">push (receive-pack)</text>
    <text x="486" y="258">want-ref · SHA-256 · v0/v1</text>
    <text x="486" y="276">Git LFS endpoints</text>
  </g>
  <text x="486" y="293" font-size="9.5" fill="#a8a29e" font-family="ui-monospace, Consolas, monospace">forwarded, uncached</text>

  <!-- object cache -->
  <line x1="358" y1="300" x2="358" y2="314" stroke="#44403c" stroke-width="1.8" marker-end="url(#a)"/>
  <rect x="258" y="318" width="414" height="64" rx="9" fill="#ffffff" stroke="#44403c"/>
  <text x="272" y="338" font-size="12" font-weight="600" fill="#1c1917">persistent object cache</text>
  <text x="272" y="356" font-size="10.5" fill="#57534e" font-family="ui-monospace, Consolas, monospace">repos/&lt;hash&gt;/repo.git — staging → validate → publish</text>
  <text x="272" y="372" font-size="10.5" fill="#57534e" font-family="ui-monospace, Consolas, monospace">LRU budget · geometric repack · cruft GC (14 d) · reftable</text>

  <!-- origin -->
  <rect x="740" y="88" width="196" height="210" rx="12" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="838" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1917">origin</text>
  <text x="838" y="132" text-anchor="middle" font-size="10.5" fill="#57534e">GitHub · GitLab · self-hosted</text>
  <g font-size="10.5" fill="#57534e" font-family="ui-monospace, Consolas, monospace">
    <text x="756" y="158">live authorization</text>
    <text x="756" y="174">(per request)</text>
    <text x="756" y="198">exact-OID hydration</text>
    <text x="756" y="222">writes · LFS data</text>
    <text x="756" y="246">source of truth for</text>
    <text x="756" y="262">refs and visibility</text>
  </g>

  <!-- container -> origin arrows -->
  <g font-size="10" fill="#57534e" font-family="ui-monospace, Consolas, monospace">
    <line x1="690" y1="212" x2="734" y2="164" stroke="#44403c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <text transform="translate(697 200) rotate(-47)">authorize · hydrate</text>
    <line x1="690" y1="252" x2="734" y2="220" stroke="#44403c" stroke-width="2" marker-end="url(#a)"/>
    <text transform="translate(694 248) rotate(-36)">forwarded untouched</text>
  </g>
</svg>
