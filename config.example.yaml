# Single-site mode: /group/repo[.git] proxies to the configured upstream.
mode: single
upstream:
  url: https://gitlab.com

listen: 127.0.0.1:8080
cache_dir: ~/.git-cdn/caches
max_cache_bytes: 21474836480 # 20 GiB, LRU across repository scopes
repack_pack_threshold: 32
repack_timeout: 2m
gc_interval: 24h
gc_timeout: 30m # A cruft repack rewrites every pack; separate from repack_timeout
gc_retention: 336h # Minimum 14 days
git_binary: git
auth_headers: [Authorization]
max_request_bytes: 8388608
max_refs_bytes: 16777216
max_response_bytes: 1073741824
max_concurrent_git: 4
max_concurrent_requests: 16
max_requests_per_second: 64
max_temp_response_bytes: 4294967296 # 4 GiB across all unfinished local responses
max_pack_cache_bytes: 1073741824 # 1 GiB per repository for verbatim response reuse; negative disables
write_idle_timeout: 30s
request_timeout: 10m
fetch_timeout: 2m
git_timeout: 5m
upstream_timeout: 30s

# Origins are reached directly and verified against the system roots by default.
# Proxy variables from the environment are ignored; egress is configured here only.
# upstream_proxy: http://proxy.example:3128 # http, https, socks5 or socks5h; credentials may be embedded
# upstream_ca_file: /etc/git-cdn/origin-ca.pem # private CA for HTTPS upstreams

# To terminate HTTPS in this process, configure both:
# tls_cert: /path/to/fullchain.pem
# tls_key: /path/to/privkey.pem
