# One instance, both transports. HTTP defaults to single-site github —
# repository paths map straight through, /git/git.git to
# https://github.com/git/git.git. github's SSH takes public keys, not
# passwords, so the SSH password proxy points at the bundled demo origin;
# a real deployment swaps in an origin that accepts reusable passwords or
# tokens over SSH.
mode: single
upstream:
  url: https://github.com
listen: 0.0.0.0:8080
allow_insecure_http: true
cache_dir: /var/lib/git-cdn/caches
ssh:
  listen: 0.0.0.0:2222
  host_key: /var/lib/git-cdn/ssh_host_ed25519_key
  allowed_users: [git]
  mode: single
  upstream:
    address: origin:22
    user: git
    known_hosts: /etc/git-cdn/origin_known_hosts
    host_key_policy: strict
