    <script>
      // Pre-paint theme: apply the stored manual choice before first paint
      // (assets/theme.js owns the toggle wiring).
      (function () {
        try {
          var t = localStorage.getItem("banyan.theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
